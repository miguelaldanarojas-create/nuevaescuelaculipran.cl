<svg viewBox="0 0 400 300" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="fpTitle">
  <title id="fpTitle">Ilustración de una pareja bailando, con banderines de fiesta</title>
  <defs>
    <linearGradient id="fpBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#EF7B45"/>
      <stop offset="100%" stop-color="#B8511F"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" fill="url(#fpBg)"/>

  <!-- guirnalda de banderines -->
  <g fill="#FFFDF8" opacity="0.9">
    <polygon points="20,26 45,26 32.5,58"/>
    <polygon points="65,26 90,26 77.5,58"/>
    <polygon points="110,26 135,26 122.5,58"/>
    <polygon points="155,26 180,26 167.5,58"/>
    <polygon points="200,26 225,26 212.5,58"/>
    <polygon points="245,26 270,26 257.5,58"/>
    <polygon points="290,26 315,26 302.5,58"/>
    <polygon points="335,26 360,26 347.5,58"/>
  </g>
  <line x1="10" y1="26" x2="390" y2="26" stroke="#FFFDF8" stroke-width="3" opacity="0.9"/>

  <!-- pareja bailando cueca, estilo plano -->
  <g transform="translate(140,110)">
    <!-- figura 1 -->
    <circle cx="0" cy="0" r="16" fill="#FFFDF8"/>
    <path d="M -34 96 C -34 40 -20 20 0 20 C 20 20 34 40 34 96 Z" fill="#C99A3E"/>
    <path d="M 0 30 C 40 20 58 5 62 -14" stroke="#FFFDF8" stroke-width="8" stroke-linecap="round" fill="none"/>
    <circle cx="64" cy="-16" r="9" fill="#FFFDF8"/>
  </g>

  <g transform="translate(240,110) scale(-1,1)">
    <!-- figura 2 (espejada) -->
    <circle cx="0" cy="0" r="16" fill="#FFFDF8"/>
    <path d="M -34 96 C -34 40 -20 20 0 20 C 20 20 34 40 34 96 Z" fill="#5CA860"/>
    <path d="M 0 30 C 40 20 58 5 62 -14" stroke="#FFFDF8" stroke-width="8" stroke-linecap="round" fill="none"/>
    <circle cx="64" cy="-16" r="9" fill="#FFFDF8"/>
  </g>

  <!-- suelo -->
  <rect x="0" y="230" width="400" height="70" fill="#FFFDF8" opacity="0.12"/>
</svg>
